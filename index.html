<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>low-key.com</title>
<style>
:root{--bg:#000;--text:#fff;--card:#111;--border:#333}
body.light{--bg:#f5f5f7;--text:#111;--card:#fff;--border:#ddd}
body{background:var(--bg)!important;color:var(--text)!important;font-family:sans-serif;transition:.3s;margin:0}
.box{text-align:center;width:90%;max-width:400px;margin:100px auto}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);margin:10px 0;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:10px;border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer}
body.light button{background:#000;color:#fff}
.toggle{position:fixed;top:14px;right:14px;z-index:9999;width:auto!important;padding:8px 14px!important;border-radius:20px!important;background:var(--card)!important;color:var(--text)!important;border:1px solid var(--border)!important;font-size:18px}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn 0.6s ease-out}
.box{animation:slideUp 0.7s ease;transition:transform 0.3s ease}
.box:active{transform:scale(0.97)}
</style>
</head>
<body>
<button class="toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
<div class="box">
<h1>low-key.com 🤫</h1>
<p>what should we call you?</p>
<input id="name" placeholder="your name">
<button onclick="go()">enter</button>
</div>
<script>
function toggleTheme(){
 document.body.classList.toggle('light');
 const isLight=document.body.classList.contains('light');
 localStorage.setItem('lowkey-theme',isLight?'light':'dark');
 document.getElementById('themeBtn').textContent=isLight?'☀️':'🌙';
}
if(localStorage.getItem('lowkey-theme')==='light'){document.body.classList.add('light');document.getElementById('themeBtn').textContent='☀️';}
function go(){
 let n=document.getElementById('name').value;
 if(!n) return alert('type your name');
 localStorage.setItem('lowkey_name', n);
 window.location.href='invite.html?name='+encodeURIComponent(n);
}
  // smooth exit
document.querySelectorAll('a').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    document.body.style.transition='opacity 0.3s';
    document.body.style.opacity='0';
    setTimeout(()=>location=a.href,300);
  });
});
</script>
</body>
</html>
