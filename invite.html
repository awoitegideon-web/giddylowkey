<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited</title>
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
body.light{background:#f5f5f5;color:#111}
.box{max-width:360px;width:90%;text-align:center;padding:30px;border:1px solid #222;border-radius:20px}
.light .box{border-color:#ddd;background:white}
img{width:80px;height:80px;border-radius:50%}
h1{font-size:26px;margin:15px 0 5px}
p{opacity:0.7;margin-bottom:20px}
.btn{display:block;padding:14px;border-radius:30px;text-decoration:none;font-weight:600;margin:10px 0}
.btn-white{background:white;color:black}
.btn-outline{border:1px solid #333;color:white}
.light .btn-outline{border-color:#ccc;color:#111}
.small{font-size:12px;opacity:0.5;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<img src="https://i.postimg.cc/xjpnLkkD/giddy.jpg">
<h1 id="hi">You're invited</h1>
<p id="sub">low-key, but loud work. Accept invite?</p>
<a id="whatsappBtn" class="btn btn-white" href="https://wa.me/2348088486666?text=Yo%20Giddy">Accept on WhatsApp →</a>
<a class="btn btn-outline" href="portfolio.html">View my work</a>
<div class="small" id="viewCount"></div>
</div>
<script>
const params=new URLSearchParams(window.location.search);
let name=params.get('name')||localStorage.getItem('lowkey-lastGuest')||'friend';
if(params.get('name')) localStorage.setItem('lowkey-lastGuest', name);
document.getElementById('hi').textContent=`${name}, you're invited`;

let views=JSON.parse(localStorage.getItem('lowkey_views')||'[]');
views.push({name:name,time:new Date().toLocaleString()});
localStorage.setItem('lowkey_views',JSON.stringify(views));
document.getElementById('viewCount').textContent=`${views.length} views`;

const myNumber='2348088486666';
const msg=`Yo Giddy, it's ${name}. I checked your invite link ✨`;
document.getElementById('whatsappBtn').href=`https://wa.me/${myNumber}?text=${encodeURIComponent(msg)}`;
</script>
</body>
</html>
